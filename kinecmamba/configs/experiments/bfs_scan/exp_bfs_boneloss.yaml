# BFS + bone loss + EMA — continue-fine-tune of the already-trained BFS checkpoint.
#
# Purpose: push the corrected-BFS model below PoseMamba-S (41.8mm) WITHOUT retraining
# from scratch and WITHOUT the order-mismatch penalty of fine-tuning the official
# (native-order) checkpoint. We start from the BFS checkpoint, which already learned its
# Mamba recurrence in BFS joint order, and add two anatomy-aware bone losses plus weight
# EMA on top.
#
# Why bone loss here: the BFS scan orders joints along the kinematic tree; the bone
# losses supervise the lengths (loss_limb_gt) and the temporal rigidity (loss_limb_var)
# of that SAME tree's 16 edges. Scan and loss reinforce one identical anatomical
# structure. The bone-loss implementation (lib/model/loss.py get_limb_lens) uses the
# exact H36M 17-joint kinematic tree, so it is correct as-is.
#
# Load the BFS checkpoint via CLI (finetune path, starts at epoch 0):
#   python train.py --config configs/experiments/bfs_scan/exp_bfs_boneloss.yaml \
#     -p <dir-with-best-BFS-checkpoint> -ms best_epoch.bin -c checkpoint/bfs_boneloss
# Do NOT use -r/--resume (it fast-forwards the epoch counter).

# General
train_2d: False
no_eval: False
finetune: True            # load the BFS checkpoint via -p/-ms, train fresh epochs
partial_train: null

# Training — short low-LR polish annealed to zero, a touch longer to let bone loss act
epochs: 25
checkpoint_frequency: 5
batch_size: 8
accum_steps: 4            # effective batch 32
dropout: 0.0
learning_rate: 0.00005    # 5e-5: gentle, but enough to adapt to the added bone objective
weight_decay: 0.01
lr_decay: 0.99            # unused under cosine; kept for compatibility
lr_scheduler: cosine      # anneals learning_rate -> 0 over the epochs
warmup_epochs: 0
grad_clip_norm: 1.0

# EMA
use_ema: True
ema_decay: 0.999

# Model — MUST match the BFS checkpoint (exp_bfs_scratch.yaml / exp_bfs_continue.yaml)
backbone: "PoseMamba"
maxlen: 243
dim_feat: 64
mlp_ratio: 2
depth: 10
att_fuse: True
input_channels: 3
use_ssi: False
use_msm: False
use_hypergcn: False
use_gat_head: False
forward_type: v2_bfs

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [H36M-SH]
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: True
sample_stride: 1
num_joints: 17
no_conf: False
gt_2d: False

# Loss — add the two anatomy-aware bone losses + restore temporal smoothness
lambda_3d: 1.0
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lg: 0.5            # bone-length L1 vs GT (loss_limb_gt)
lambda_lv: 1.0            # bone-length temporal variance (loss_limb_var); small-magnitude, weighted above lg
lambda_diff: 0.5          # restore temporal-smoothness term (was 0 in the from-scratch run)
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0

# Augmentation — OFF this run (Augmenter2D needs external assets; try in a later run)
synthetic: False
flip: True
mask_ratio: 0.
mask_T_ratio: 0.
noise: False

# Wandb
wandb_project: PoseMamba-bfs-scan
wandb_entity: msds24068-itu-lahore
