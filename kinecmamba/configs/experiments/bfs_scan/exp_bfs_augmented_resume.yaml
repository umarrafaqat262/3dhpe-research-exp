# BFS augmented — resume from Stage 3 epoch 120, with data leakage (masking)
# Aim: push MPJPE below 41.8mm via robust augmentations

# General
train_2d: False
no_eval: False
finetune: False
partial_train: null

# Training — resume from epoch 120, run 10 more
epochs: 130
checkpoint_frequency: 5
batch_size: 8
accum_steps: 4
dropout: 0.0
learning_rate: 0.0005
weight_decay: 0.01
lr_decay: 0.99
lr_scheduler: exponential
warmup_epochs: 0
grad_clip_norm: 0

# Model
backbone: "PoseMamba"
maxlen: 243
dim_feat: 64
mlp_ratio: 2
depth: 10
att_fuse: True
input_channels: 3
use_ssi: False
use_msm: False
use_hypergcn: False
use_gat_head: False
forward_type: v2_bfs

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [H36M-SH]
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: True
sample_stride: 1
num_joints: 17
no_conf: False
gt_2d: False

# Loss
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0
lambda_3d: 1.0
lambda_diff: 0.0

# Augmentation — data leakage: enable joint/frame masking
synthetic: False
flip: True
mask_ratio: 0.3
mask_T_ratio: 0.1
noise: False

# Wandb
wandb_project: PoseMamba-bfs-scan
wandb_entity: msds24068-itu-lahore
name: exp_bfs_augmented_resume
