# DATA-LEAKAGE EXPERIMENT (diagnostic only — NOT a valid result to report).
#
# Fine-tune the CORRECTED-BFS checkpoint (forward_type v2_bfs, NOT fused) with test
# subject S9 injected into the TRAINING set, then evaluate on the standard test set
# (S9 + S11). Because S9 is now in both train and test, the S9 portion of the metric
# is leaked and will drop sharply; S11 stays clean. The per-subject breakdown printed
# by evaluate() (train.py) makes the effect visible.
#
# Setup (on the GPU/data box, from kinecmamba/):
#   1) python make_leak_s9_clips.py --out_dir data/motion3d/MB3D_f243s81/H36M-SH/train \
#          --subject s_09 --stride 81
#   2) python train.py --config configs/experiments/bfs_scan/exp_bfs_leak_s9.yaml \
#          -p <corrected-bfs-ckpt-dir> -ms best_epoch.bin -c checkpoint/leak_s9
#   3) undo:  rm data/motion3d/MB3D_f243s81/H36M-SH/train/LEAK_S9_*.pkl
# See LEAK_S9_EXPERIMENT.md.

# General
train_2d: False
no_eval: False
finetune: True            # load the corrected-BFS checkpoint via -p/-ms, train fresh epochs
partial_train: null

# Training — short fine-tune so the model can memorize the leaked S9 clips
epochs: 10
checkpoint_frequency: 5
batch_size: 8
accum_steps: 4            # effective batch 32
dropout: 0.0
learning_rate: 0.00005    # 5e-5: enough to fit the injected S9 clips within a few epochs
weight_decay: 0.01
lr_decay: 0.99
lr_scheduler: cosine
warmup_epochs: 0
grad_clip_norm: 1.0

# EMA off — we want to watch the raw leakage behaviour, not an averaged view
use_ema: False

# Model — MUST match the corrected-BFS checkpoint.
# Default here matches the from-scratch corrected BFS (3-channel, no_conf False).
# If your checkpoint is the 2-channel fine-tune, set input_channels: 2 and no_conf: True.
backbone: "PoseMamba"
maxlen: 243
dim_feat: 64
mlp_ratio: 2
depth: 10
att_fuse: True
input_channels: 3
use_ssi: False
use_msm: False
use_hypergcn: False
use_gat_head: False
forward_type: v2_bfs

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [H36M-SH]    # the leaked S9 clips are injected INTO H36M-SH/train
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: True
sample_stride: 1
num_joints: 17
no_conf: False
gt_2d: False

# Test-time multi-clip averaging OFF (the per-subject breakdown needs the standard path)
test_multiclip: False

# Loss — identical to the corrected-BFS objective
lambda_3d: 1.0
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0
lambda_diff: 0.0

# Augmentation
synthetic: False
flip: True
mask_ratio: 0.
mask_T_ratio: 0.
noise: False

# Wandb
wandb_project: PoseMamba-bfs-scan
wandb_entity: msds24068-itu-lahore
