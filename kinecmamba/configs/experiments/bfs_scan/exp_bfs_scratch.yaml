# Corrected BFS kinematic scan — TRAIN FROM SCRATCH (paper recipe)
#
# Why this exists: fine-tuning the official checkpoint INTO the BFS scan plateaus
# at ~42.5mm (never reaches the 41.8mm baseline). Root cause: the Mamba SSM is
# sequence-order-specific, and the official checkpoint learned its recurrence in
# the NATIVE joint order (v2_plus_poselimbs). Re-ordering joints to BFS at
# fine-tune time mismatches those weights, so the model starts disrupted (~44mm
# at epoch 1) and only partially recovers.
#
# The corrected BFS scan can only pay off if the SSM learns its dynamics in BFS
# order from the start. This config does that: no checkpoint, full paper recipe.
# Requires the scan bug fixes in lib/model/csms6s.py.

# General
train_2d: False
no_eval: False
finetune: False          # from scratch — do NOT load the official checkpoint
partial_train: null

# Training — paper recipe (MotionBERT/PoseMamba), run to full convergence
epochs: 120
checkpoint_frequency: 20
# Effective batch 32 = 8 * 4 (gradient accumulation; fits one GPU at 243 frames).
batch_size: 8
accum_steps: 4
dropout: 0.0
learning_rate: 0.0005    # paper LR for from-scratch at batch 32
weight_decay: 0.01
lr_decay: 0.99
lr_scheduler: exponential
warmup_epochs: 0
grad_clip_norm: 0        # paper uses no gradient clipping from scratch

# Model
backbone: "PoseMamba"
maxlen: 243
dim_feat: 64
mlp_ratio: 2
depth: 10
att_fuse: True
input_channels: 3        # from-scratch: feed detector confidence (no shape clash,
                         # since no 2-channel checkpoint is loaded)
use_ssi: False
use_msm: False
use_hypergcn: False
use_gat_head: False
forward_type: v2_bfs

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [H36M-SH]
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: True
sample_stride: 1
num_joints: 17
no_conf: False           # keep the 3rd (confidence) channel
gt_2d: False

# Loss (reference recipe — no non-paper temporal-diff term)
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0
lambda_3d: 1.0
lambda_diff: 0.0

# Augmentation
synthetic: False
flip: True
mask_ratio: 0.
mask_T_ratio: 0.
noise: False

# Wandb
wandb_project: PoseMamba-bfs-scan
wandb_entity: msds24068-itu-lahore
