# Corrected BFS scan — GENTLE fine-tune (low LR, fast decay)
#
# The lr=2e-4 fine-tune (exp_ft_bfs_corrected.yaml) oscillates 42.5<->43.9mm for
# 20+ epochs — LR too high, optimizer bounces around the basin. This variant uses
# a much lower LR that decays faster so it settles. Cheap (~20 epochs) sanity that
# the fine-tune floor is LR-bound, not architecture-bound. Won't likely beat 41.8
# if the checkpoint-under-BFS init is already >43mm; use exp_bfs_scratch.yaml for
# the real SOTA attempt.

# General
train_2d: False
no_eval: False
finetune: True
partial_train: null

# Training — gentle settle
epochs: 20
checkpoint_frequency: 5
batch_size: 8
accum_steps: 4           # effective batch 32
dropout: 0.0
learning_rate: 0.00003   # 3e-5: gentle adaptation, preserve the init
weight_decay: 0.01
lr_decay: 0.95           # decay faster so LR reaches ~1e-5 by the end
lr_scheduler: exponential
warmup_epochs: 0
grad_clip_norm: 1.0

# Model
backbone: "PoseMamba"
maxlen: 243
dim_feat: 64
mlp_ratio: 2
depth: 10
att_fuse: True
input_channels: 2
use_ssi: False
use_msm: False
use_hypergcn: False
use_gat_head: False
forward_type: v2_bfs

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [H36M-SH]
dt_file: h36m_sh_conf_cam_source_final.pkl
clip_len: 243
data_stride: 81
rootrel: True
sample_stride: 1
num_joints: 17
no_conf: True
gt_2d: False

# Loss
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0
lambda_3d: 1.0
lambda_diff: 0.0

# Augmentation
synthetic: False
flip: True
mask_ratio: 0.
mask_T_ratio: 0.
noise: False

# Wandb
wandb_project: PoseMamba-bfs-scan
wandb_entity: msds24068-itu-lahore
